# ahura-agent-runner Deployment
#
# Processes queued agentcore.runs: atomically claims each, executes the durable
# agent loop (model turns via the inference gateway; hosted tools in S2), and
# persists per-step traces. Like eval-runner it needs NO GPU — only HTTP calls
# to our own /v1/chat/completions.
#
# Single replica is safe for v1: MAX_CONCURRENT_JOBS controls per-process
# parallelism. The claim is atomic (UPDATE WHERE status='queued'), so raising
# replicas later won't double-execute a run.
#
# Required secret: ahura-agent-runner-secrets (see secret.yaml.template).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahura-agent-runner
  namespace: ahura
  labels:
    app: ahura-agent-runner
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ahura-agent-runner
  template:
    metadata:
      labels:
        app: ahura-agent-runner
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: runner
          image: ghcr.io/cs2hvh/ahura-agent-runner:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: ahura-agent-runner-secrets
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ahura-agent-runner-health
  namespace: ahura
spec:
  type: ClusterIP
  selector:
    app: ahura-agent-runner
  ports:
    - port: 8080
      targetPort: health
      protocol: TCP
      name: health

# ── Secret template (create once, never commit real values) ────────────────────
#
# kubectl create secret generic ahura-agent-runner-secrets \
#   --namespace ahura \
#   --from-literal=REDIS_URL="redis://:password@redis-host:6379/0" \
#   --from-literal=SUPABASE_URL="https://xxx.supabase.co" \
#   --from-literal=SUPABASE_SERVICE_ROLE_KEY="eyJ..." \
#   --from-literal=INFERENCE_PLATFORM_KEY="sk-ahura-platform-..." \
#   --from-literal=INFERENCE_BASE_URL="https://api.ahurasense.com/v1" \
#   --from-literal=MODEL_TURN_TIMEOUT_MS="120000" \
#   --from-literal=MAX_CONCURRENT_JOBS="4" \
#   --from-literal=CLAIM_POLL_INTERVAL_MS="5000"
