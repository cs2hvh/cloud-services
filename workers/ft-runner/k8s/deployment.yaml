# ahura-ft-runner Deployment
#
# HA: 2 replicas remove the single-point-of-failure. Concurrency is safe across
# replicas because (1) the BullMQ queue (shared Redis) delivers each job to one
# worker, (2) the claim is an atomic conditional transition
# (UPDATE ... SET status='preparing' WHERE status='queued'), and (3) jobIds are
# deterministic, so a duplicate enqueue is rejected. The finetune-watchdog
# backstops any pod orphaned by a replica dying mid-job.
#
# To raise per-replica concurrency, bump MAX_CONCURRENT_JOBS in the secret;
# total parallel jobs = replicas × MAX_CONCURRENT_JOBS (bounded per-org by the
# inference FT concurrency quota + balance gate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahura-ft-runner
  namespace: ahura
  labels:
    app: ahura-ft-runner
    tier: backend
spec:
  replicas: 2
  strategy:
    # Zero-downtime rollout: keep both replicas available, surge a 3rd while
    # retiring old ones. Safe because claims are atomic + BullMQ-coordinated.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ahura-ft-runner
  template:
    metadata:
      labels:
        app: ahura-ft-runner
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: runner
          image: ghcr.io/cs2hvh/ahura-ft-runner:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: ahura-ft-runner-secrets
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # k8s requires a numeric UID to verify runAsNonRoot. Our
            # Dockerfile sets USER 'app' (named) so we override here.
            # 1000 is just a conventional non-system UID; /app files are
            # world-readable so it works.
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
      # imagePullSecrets removed — ghcr.io/cs2hvh/ahura-ft-runner is a public package.
      # If you make the package private later, add back:
      #   imagePullSecrets:
      #     - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: ahura-ft-runner-health
  namespace: ahura
spec:
  type: ClusterIP
  selector:
    app: ahura-ft-runner
  ports:
    - port: 8080
      targetPort: health
      protocol: TCP
      name: health
