# ahura-data-runner Deployment
#
# Processes queued inference.connectors by syncing each source (S3 / web-crawl)
# into its bound vector collection. Like eval-runner, this needs NO GPU — it
# only makes HTTP calls to our own /v1/embeddings and /v1/ocr endpoints.
#
# Single replica is safe for v1: MAX_CONCURRENT_JOBS controls how many
# connectors sync in parallel within the process; the claim is atomic
# (UPDATE WHERE status='queued') so multiple replicas won't pick the same one.
# Raise replicas only when a single replica's sync throughput is the bottleneck.
#
# Required secret: ahura-data-runner-secrets (see bottom of this file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahura-data-runner
  namespace: ahura
  labels:
    app: ahura-data-runner
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ahura-data-runner
  template:
    metadata:
      labels:
        app: ahura-data-runner
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: runner
          image: ghcr.io/cs2hvh/ahura-data-runner:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: ahura-data-runner-secrets
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ahura-data-runner-health
  namespace: ahura
spec:
  type: ClusterIP
  selector:
    app: ahura-data-runner
  ports:
    - port: 8080
      targetPort: health
      protocol: TCP
      name: health

# ── Secret template (create once, never commit real values) ────────────────────
#
# kubectl create secret generic ahura-data-runner-secrets \
#   --namespace ahura \
#   --from-literal=REDIS_URL="redis://:password@redis-host:6379/0" \
#   --from-literal=SUPABASE_URL="https://xxx.supabase.co" \
#   --from-literal=SUPABASE_SERVICE_ROLE_KEY="eyJ..." \
#   --from-literal=INFERENCE_PLATFORM_KEY="ahu_live_..." \
#   --from-literal=INFERENCE_BASE_URL="https://api.ahurasense.com/v1" \
#   --from-literal=BYOK_DEK="<base64 32-byte key, same as the app's BYOK_DEK>" \
#   --from-literal=FETCH_CONCURRENCY="8" \
#   --from-literal=EMBED_BATCH="96" \
#   --from-literal=OCR_ENABLED="true" \
#   --from-literal=OCR_MODEL="ahura/ocr-doc" \
#   --from-literal=OCR_MIN_CHARS="20" \
#   --from-literal=S3_ENDPOINT_ALLOW_PRIVATE="false" \
#   --from-literal=MAX_CONCURRENT_JOBS="2" \
#   --from-literal=CLAIM_POLL_INTERVAL_MS="5000"
