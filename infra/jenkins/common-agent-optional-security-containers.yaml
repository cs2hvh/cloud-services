# Optional additions for common-agent pod template
# These are NOT in current production Jenkins common-agent.
# Add only if you want to avoid runtime downloads for security tools.

spec:
  containers:
    - name: hadolint
      image: hadolint/hadolint:v2.12.0-alpine
      command: ["cat"]
      tty: true
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"

    - name: gitleaks
      image: zricethezav/gitleaks:v8.18.0
      command: ["cat"]
      tty: true
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "300m"
