services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-services-jenkins:2.528.2-lts-jdk21
    container_name: cloud-services-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--requestHeaderSize=65536
    volumes:
      - ./data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
