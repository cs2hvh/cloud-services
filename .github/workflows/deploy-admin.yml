# Auto-deploy the ADMIN PANEL to the Linode VM — fully self-bootstrapping.
#
# Mirrors deploy.yml but for the standing branch feat/separate-admin-panel and
# its own checkout + service on the VM (/root/cloud-admin-panel, ahura-admin,
# port 3001, fronted by control.ahurasense.com). The main app's checkout and
# ahura-web are never touched.
#
# Self-bootstrapping: every run scp's deploy/deploy-admin.sh from THIS commit
# to /root/deploy-admin.sh before executing it, so (a) first deploy needs no
# human on a terminal, and (b) the VM copy of the script can never go stale
# relative to the repo. The script itself clones the checkout, copies .env
# from the main checkout, installs its systemd unit, and writes the origin
# nginx vhost (add-only, nginx -t gated) on first run.
#
# Uses the SAME secrets as the main deploy (same VM): DEPLOY_HOST,
# DEPLOY_USER, DEPLOY_PASSWORD, DEPLOY_PORT in the "DEPLOY_HOST" environment.

name: Deploy admin panel

on:
  push:
    branches: [feat/separate-admin-panel]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: feat/separate-admin-panel

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEPLOY_HOST
    steps:
      - name: Checkout (for the deploy script)
        uses: actions/checkout@v4

      - name: Ship deploy script to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: deploy/deploy-admin.sh
          target: /root/
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            chmod +x /root/deploy-admin.sh
            bash /root/deploy-admin.sh "${{ github.event.inputs.branch || github.ref_name }}"
