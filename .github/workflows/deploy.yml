# Auto-deploy the web app to the Linode VM (password SSH).
#
# Triggers:
#   - push to `dev`  → deploys `dev`
#   - manual run     → pick any branch from the Actions tab ("Run workflow")
#
# One-time setup — add these in GitHub → Settings → Secrets and variables → Actions:
#   DEPLOY_HOST      the VM's public IP (e.g. 203.0.113.10)
#   DEPLOY_USER      root            (or your deploy user)
#   DEPLOY_PASSWORD  that user's SSH password
#   DEPLOY_PORT      (optional) SSH port, defaults to 22
#
# Requires deploy/deploy.sh on the VM at /root/deploy.sh:
#   cp deploy/deploy.sh /root/deploy.sh && chmod +x /root/deploy.sh
#
# NOTE: password auth means a leaked secret = shell access. The VM must allow it
# (sshd_config: PasswordAuthentication yes; for root: PermitRootLogin yes). An SSH
# *key* is more secure if you ever want to switch (then use `key:` instead of
# `password:`). Either way, keep the secret out of the repo.

name: Deploy

on:
  push:
    branches: [dev]          # change/add branches you want auto-deployed
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: dev
      skip_checks:
        description: Deploy even if the typecheck fails (emergency only)
        required: false
        default: 'false'

concurrency:
  group: deploy-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false   # don't interrupt an in-flight build mid-deploy

jobs:
  # ── the gate ──────────────────────────────────────────────────────────────
  #
  # Until 2026-09-03 nothing stood between a push to dev and production. The
  # vitest suite had been red for long enough that a red suite carried no
  # signal, so it could not be the gate. The typecheck was clean, so it can:
  # `next build` would fail on the host anyway, but failing HERE keeps the
  # broken revision off the box and out of `git reset --hard`.
  #
  # The unit tests run alongside and do not gate yet (72 of 196 files were
  # failing on 2026-09-03). They are here so the count is visible on every
  # push instead of nowhere; the day the suite is green, move it into the gate.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (not gating yet — see the comment above)
        run: npx vitest run --reporter=default 2>&1 | tail -40

  deploy:
    needs: [typecheck]
    if: ${{ always() && (needs.typecheck.result == 'success' || github.event.inputs.skip_checks == 'true') }}
    runs-on: ubuntu-latest
    environment: DEPLOY_HOST    # your secrets live in the environment named "DEPLOY_HOST"
    steps:
      - name: Deploy over SSH (password)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m        # next build can take a few minutes
          script: |
            set -u
            BRANCH="${{ github.event.inputs.branch || github.ref_name }}"

            # ── run the INCOMING branch's deploy.sh ───────────────────────────
            #
            # /root/deploy.sh lives OUTSIDE the repo on purpose, so `git reset`
            # cannot touch it. It used to be refreshed AFTER the deploy, which
            # meant a fix to the deploy path never ran on the deploy that
            # shipped it. Now it is taken from origin/$BRANCH first, so the
            # script that runs is always the one in the commit being deployed.
            git -C /root/cloud-services fetch --prune origin "$BRANCH"
            git -C /root/cloud-services show "origin/$BRANCH:deploy/deploy.sh" > /root/deploy.sh
            chmod +x /root/deploy.sh
            bash /root/deploy.sh "$BRANCH" || { echo "=== deploy.sh FAILED: the previous build is still live ==="; exit 1; }

            # PROVE THE HOST IS ON THE COMMIT THIS RUN IS FOR. deploy.sh prints
            # the short sha, but nothing checked it against the branch head.
            HEAD="$(git -C /root/cloud-services rev-parse HEAD)"
            WANT="$(git -C /root/cloud-services rev-parse "origin/$BRANCH")"
            if [ "$HEAD" != "$WANT" ]; then
              echo "host is on $HEAD but origin/$BRANCH is $WANT"
              exit 1
            fi
            echo "host HEAD $HEAD = origin/$BRANCH"

            # ── the build worker must be a managed service ────────────────────
            #
            # It had no unit and ran as a hand-started process, so no deploy ever
            # restarted it and five days of build-path fixes shipped without ever
            # executing. Installing it here means the cutover happens once, from
            # CI, and every deploy afterwards restarts it via deploy.sh.
            cp /root/cloud-services/deploy/systemd/ahura-build-worker.service /etc/systemd/system/
            systemctl daemon-reload

            # ONLY while systemd is not yet the owner. Once the unit is active
            # this is skipped, because pkill would match the managed process too
            # and killing it mid-build orphans a deployment in `building` — the
            # queue claim is not atomic and there is no resume. After cutover,
            # deploy.sh restarts it properly, which is a graceful stop.
            if ! systemctl is-active --quiet ahura-build-worker; then
              echo "first cutover: stopping any hand-started worker"
              pkill -f 'scripts/v2/build-worker.ts' || true
              sleep 2
            fi
            systemctl enable ahura-build-worker || true
            systemctl restart ahura-build-worker || true

            # PROVE IT CAME UP. `enable --now` returning is not evidence: with
            # Restart=always a unit whose process dies immediately sits in
            # auto-restart and can still look like a successful start. The first
            # version of this block trusted that, and because the pkill above had
            # already stopped the hand-started worker, the result was no worker at
            # all — builds stopped entirely and the only signal was a red run with
            # its reason inside logs that need auth to read.
            #
            # So: assert, and put the journal in the run output where whoever
            # reads this can see the actual error without shell access.
            sleep 5
            if systemctl is-active --quiet ahura-build-worker; then
              echo "build worker ACTIVE"
              journalctl -u ahura-build-worker -n 10 --no-pager || true
            else
              echo "=============================================="
              echo "BUILD WORKER FAILED TO START — NOTHING IS BUILDING"
              echo "=============================================="
              journalctl -u ahura-build-worker -n 40 --no-pager || true
              exit 1
            fi

            # ── the billing sweep and renewal timers are installed HERE ───────
            #
            # Until 2026-09-03 the hourly billing sweep timer existed only
            # because someone once ran the commands in deploy/systemd/README.md
            # by hand. A rebuilt host would have billed nothing and said
            # nothing — the 2026-08-24 failure with a different file name.
            # Game and domain renewals had no scheduler at all after the old
            # cron worker was deleted. All three are unit files in the repo now
            # and every deploy re-installs them.
            for u in ahura-billing-sweep ahura-game-renewals ahura-domain-renewals; do
              cp "/root/cloud-services/deploy/systemd/$u.service" /etc/systemd/system/
              cp "/root/cloud-services/deploy/systemd/$u.timer"   /etc/systemd/system/
            done
            systemctl daemon-reload

            # The retired v1 biller must never start again (see deploy.sh).
            systemctl disable --now ahura-cron 2>/dev/null || true
            systemctl mask ahura-cron 2>/dev/null || true

            for u in ahura-billing-sweep ahura-game-renewals ahura-domain-renewals; do
              systemctl enable --now "$u.timer" || true
            done
            sleep 2

            # PROVE THEY ARE ARMED. A timer that failed to enable is silent.
            TIMERS_OK=1
            for u in ahura-billing-sweep ahura-game-renewals ahura-domain-renewals; do
              if systemctl is-active --quiet "$u.timer"; then
                echo "$u.timer ACTIVE"
              else
                echo "=============================================="
                echo "$u.timer IS NOT ACTIVE"
                echo "=============================================="
                systemctl status "$u.timer" --no-pager || true
                TIMERS_OK=0
              fi
            done
            systemctl list-timers 'ahura-*' --no-pager || true
            if systemctl is-enabled ahura-cron 2>/dev/null | grep -q masked; then
              echo "ahura-cron masked"
            else
              echo "WARNING: ahura-cron is not masked"
            fi
            [ "$TIMERS_OK" = 1 ] || exit 1
