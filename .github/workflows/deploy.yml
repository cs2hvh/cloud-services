# Auto-deploy the web app to the Linode VM.
#
# Triggers:
#   - push to `dev`  → deploys `dev`
#   - manual run     → pick any branch from the Actions tab ("Run workflow")
#
# One-time setup — add these in GitHub → Settings → Secrets and variables → Actions:
#   DEPLOY_HOST     the VM's public IP (e.g. 172.236.172.246)
#   DEPLOY_USER     root            (or your deploy user)
#   DEPLOY_SSH_KEY  a PRIVATE ssh key whose PUBLIC key is in the VM's ~/.ssh/authorized_keys
#                   (generate: ssh-keygen -t ed25519 -f deploy_key -N ""  →
#                    cat deploy_key.pub >> /root/.ssh/authorized_keys on the VM,
#                    paste the contents of deploy_key into the secret)
#
# Requires deploy/deploy.sh to exist on the VM at /root/deploy.sh
#   (cp deploy/deploy.sh /root/deploy.sh && chmod +x /root/deploy.sh)

name: Deploy

on:
  push:
    branches: [dev]          # change/add branches you want auto-deployed
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: false   # don't interrupt an in-flight build mid-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m        # next build can take a few minutes
          script: |
            bash /root/deploy.sh "${{ github.event.inputs.branch || github.ref_name }}"
