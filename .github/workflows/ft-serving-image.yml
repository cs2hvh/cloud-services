name: ft-serving image (vLLM + LoRA)

on:
  push:
    branches: [ai, master, dev]
    paths:
      - "infra/runpod/serving-images/vllm-lora/**"
      - ".github/workflows/ft-serving-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ahura-ft-serving-vllm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # vLLM base image is ~6 GB; default GHA runner disk is tight.
      # Reclaim ~25 GB upfront so the build doesn't hit "no space left".
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=vllm-0.7.3
            type=sha,prefix=sha-,format=short

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ./infra/runpod/serving-images/vllm-lora
          file: ./infra/runpod/serving-images/vllm-lora/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ft-serving
          cache-to: type=gha,mode=max,scope=ft-serving

      - name: Summary
        run: |
          echo "### Pushed image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
